plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.3'
    id "com.github.bjornvester.xjc" version "1.9.0"
}

group = 'com.example.movie'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter") // core Spring Boot
    implementation("org.springframework.boot:spring-boot-starter-web") // REST controllers
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb") // MongoDB
    implementation("com.fasterxml.jackson.core:jackson-databind") // JSON mapping
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // JAXB / XJC for XML
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:4.0.0"
    implementation "org.glassfish.jaxb:jaxb-runtime:4.0.1"
    xjc "org.glassfish.jaxb:jaxb-xjc:4.0.1"
    xjc "org.glassfish.jaxb:jaxb-runtime:4.0.1"
    xjc "org.glassfish.jaxb:jaxb-core:4.0.1"
}


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

xjc {
    xsdDir.set(file("src/main/resources/xsd"))
    includes.set(["movie.xsd","user.xsd","community.xsd","genre.xsd","likedMovies.xsd","recommendation.xsd"])
    outputJavaDir.set(file("src/main/generated"))
    defaultPackage.set("com.example.movie")
    markGenerated.set(true)
}

